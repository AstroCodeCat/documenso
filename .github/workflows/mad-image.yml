# MAD build of Documenso for sign.mad.sg. Builds docker/Dockerfile for linux/amd64 (mad1)
# and pushes ghcr.io/astrocodecat/documenso-mad:<sha> and :<branch>.
# Upstream's workflows are removed on this branch on purpose: their schedules and tag-triggered
# deploy would run against secrets this fork does not have.
name: MAD image

on:
  push:
    branches: ['mad', 'mad-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/astrocodecat/documenso-mad:${{ github.sha }}
            ghcr.io/astrocodecat/documenso-mad:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
